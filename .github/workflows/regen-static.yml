name: Regenerate static pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/regen-static.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install markdown dependencies
        run: pip install markdown markdown-it-py

      - name: Run build-static.py
        run: python build-static.py

      - name: Show changed files
        run: git status --porcelain | head -60

      - name: Commit, push and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes produced; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b regen-static-2026-09
          git add -A
          git commit -m "chore: regenerate static pages via build-static.py (GA4 G-HVN50TM5EK + favicon + meta)"
          git push -f -u origin regen-static-2026-09
          gh pr create --base main --head regen-static-2026-09 \
            --title "chore: 重建静态页(GA4 统一 G-HVN50TM5EK + favicon + meta)" \
            --body "由 GitHub Actions 自动执行 \`python build-static.py\` 重新生成 107 产品页 + 9 分类页 + 22 博客页,并刷新 sitemap。统一 GA4 属性为 G-HVN50TM5EK,补齐 favicon 与新增 meta。合并本 PR 即完成 PR #1『合并后必做』第 1 条。🤖 Generated by GitHub Actions" \
            || echo "PR already exists or could not be created"
